  PTNTIME-SCHOOL — script-upload GitHub version
  Uses apiCall(action, args) from script-core.html (fetch to Apps Script Web App).
  Ensure script-core.html is loaded before this file.
-->
<script>
// ══ PTNTIME-SCHOOL — Upload Engine (Simplified from KRUSB74) ══
function handleDragOver(e){ e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.add('drag-over'); }
function handleDragLeave(e){ e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.remove('drag-over'); }

function compressImage(file, maxDim, quality) {
  maxDim=maxDim||1600; quality=quality||0.8;
  return new Promise(function(resolve){
    if(!file.type.startsWith('image/')){ resolve(file); return; }
    var img=new Image();
    img.onload=function(){
      var w=img.width, h=img.height;
      if(w>maxDim||h>maxDim){
        if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}
        else{w=Math.round(w*maxDim/h);h=maxDim;}
      }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(function(blob){ resolve(new File([blob],file.name,{type:'image/jpeg'})); },'image/jpeg',quality);
    };
    img.onerror=function(){ resolve(file); };
    img.src=URL.createObjectURL(file);
  });
}

function uploadFileWithProgress(file, token, onProgress){
  var processPromise=(file.type.startsWith('image/')&&file.size>1024*1024)?compressImage(file):Promise.resolve(file);
  return processPromise.then(function(f){
    return new Promise(function(resolve,reject){
      var reader=new FileReader();
      reader.onload=function(){
        if(onProgress) onProgress(50);
        var base64=reader.result.split(',')[1];
        apiCall('uploadFileBase64', [base64, f.name, f.type, token]).then(function(r){
          if(onProgress) onProgress(100);
          if(r&&r.success) resolve(r);
          else reject(new Error((r&&r.message)||'Upload failed'));
        }).catch(reject);
      };
      reader.onerror=function(){ reject(new Error('File read error')); };
      reader.readAsDataURL(f);
    });
  });
}
</script>
